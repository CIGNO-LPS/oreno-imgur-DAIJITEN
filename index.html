<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Imgurランダム画像ビューア</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
      background: #111;
      color: #fff;
      margin: 0;
      padding: 10px;
      overflow-x: hidden;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .grid a {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: 6px;
    }

    .grid img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .refresh-button {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      text-align: center;
      background-color: #444;
      color: white;
      font-size: 18px;
      border-radius: 8px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="grid" id="grid"></div>
  <a href="" class="refresh-button">画像を更新する</a>

  <script>
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    const grid = document.getElementById('grid');
    const totalNeeded = 15;
    const lengths = [5, 6, 7];
    let successCount = 0;

    function randomId(length) {
      let id = '';
      for (let i = 0; i < length; i++) {
        id += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return id;
    }

    function tryAddImage() {
      const len = lengths[Math.floor(Math.random() * lengths.length)];
      const id = randomId(len);
      const imgUrl = `https://i.imgur.com/${id}.jpg`;
      const linkUrl = `imgur://gallery/${id}`;

      const a = document.createElement('a');
      a.href = linkUrl;
      a.target = "_blank";

      const img = document.createElement('img');
      img.src = imgUrl;

      img.onload = () => {
        if (img.naturalWidth > 200 && img.naturalHeight > 100) {
          a.appendChild(img);
          grid.appendChild(a);
          successCount++;
        }
        if (successCount < totalNeeded) {
          tryAddImage();
        }
      };

      img.onerror = () => {
        if (successCount < totalNeeded) {
          tryAddImage();
        }
      };
    }

    for (let i = 0; i < totalNeeded; i++) {
      tryAddImage();
    }
  </script>
</body>
</html>
