<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Imgurランダム画像ビューア</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
      background: #111;
      color: #fff;
      margin: 0;
      padding: 10px;
    }
    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .grid a {
      display: block;
      width: 100px;
      height: 100px;
      overflow: hidden;
    }
    .grid img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <h1>Imgurランダム画像ビューア</h1>
  <div class="grid" id="grid"></div>

  <script>
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';

    function randomId(length) {
      let id = '';
      for (let i = 0; i < length; i++) {
        id += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return id;
    }

    function createImgurTile(id) {
      const imgUrl = `https://i.imgur.com/${id}.jpg`;
      const linkUrl = `imgur://gallery/${id}`;

      const a = document.createElement('a');
      a.href = linkUrl;
      a.target = "_blank";

      const img = document.createElement('img');
      img.src = imgUrl;
      img.onerror = () => a.remove(); // 画像が無かったら消す

      a.appendChild(img);
      return a;
    }

    const grid = document.getElementById('grid');
    const total = 60; // 表示する画像の数
    const lengths = [5, 6, 7];

    for (let i = 0; i < total; i++) {
      const len = lengths[Math.floor(Math.random() * lengths.length)];
      const id = randomId(len);
      const tile = createImgurTile(id);
      grid.appendChild(tile);
    }
  </script>
</body>
</html>
